<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Марсианская Одиссея: Выбери дату</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🚀 Миссия на Марс</h1>
        <p>Твоя задача — выбрать идеальную дату старта с Земли. Учитывай положение планет!</p>
        
        <div class="controls">
            <label for="launchDate">Выбери дату старта:</label>
            <input type="date" id="launchDate" min="2026-01-01" max="2028-12-31">
            <button id="launchBtn">Запустить ракету!</button>
        </div>

        <div id="result" class="result-box">
            <!-- Здесь появится результат расчета -->
        </div>
        
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
